name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright-core@1.65.1
      - run: node tests/run.mjs
