<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rute — A reactive hash router</title>
  <meta name="description"
    content="Routing and reactive data in one script tag. A dependency-free router and reactivity layer for plain HTML pages.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <nav>
      <ul>
        <li><a href="#" aria-label="rute home"><img src="logo.svg" width="30" height="30" alt=""><span
              class="wordmark">rute</span></a></li>
      </ul>
      <ul>
        <li><a href="#docs">Docs</a></li>
        <li><a href="#examples">Examples</a></li>
        <li><a href="https://github.com/patrickelmer/rute">GitHub</a></li>
      </ul>
    </nav>
  </header>

  <!-- This site is a rute app: every page is a template in pages/ -->
  <main>
    <rute dir="pages/"
      404="<section class='not-found'><h1>Page not found.</h1><p class='lead'><a href='#'>Back to the home page</a></p></section>"></rute>
  </main>

  <footer>
    <span class="wordmark">rute</span>
    <span>A reactive hash router.</span>
    <a href="https://github.com/patrickelmer/rute">github.com/patrickelmer/rute</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/gh/PatrickElmer/rute@main/rute.js"></script>
  <script>
    // Mark the nav link of the current page, e.g. "Examples" on #examples/counter.
    const markCurrent = () => {
      const section = location.hash.replace(/^#\/*/, '').split('/')[0]
      for (const link of document.querySelectorAll('body > header nav a[href^="#"]')) {
        const current = section && link.getAttribute('href') === '#' + section
        if (current) link.setAttribute('aria-current', 'page')
        else link.removeAttribute('aria-current')
      }
    }
    addEventListener('hashchange', markCurrent)
    markCurrent()

    // Copy buttons in templates: <button data-copy="id-of-code-element">
    document.addEventListener('click', async event => {
      const button = event.target.closest('[data-copy]')
      if (!button) return
      const code = document.getElementById(button.dataset.copy)
      button.dataset.label ??= button.textContent
      try {
        await navigator.clipboard.writeText(code.textContent)
        button.textContent = 'Copied!'
      } catch {
        getSelection().selectAllChildren(code)
        button.textContent = 'Press Ctrl+C to copy'
      }
      setTimeout(() => (button.textContent = button.dataset.label), 2000)
    })
  </script>

</body>

</html>
