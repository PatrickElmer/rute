<header>
  <span>Result · try changing the numbers</span>
  <button type="button" onclick="price = 10; qty = 2">Reset</button>
</header>
<fieldset>
  <label>Price <input data-bind="price" type="number" value="10"></label>
  <label>Quantity <input data-bind="qty" type="number" value="2"></label>
</fieldset>
<p>Total: <span data-compute="total">price * qty</span></p>
<hr>
<small>Reload the page: rute kept your numbers in localStorage.</small>
